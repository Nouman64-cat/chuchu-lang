[package]
name = "chuchu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "cheeku"
path = "src/main.rs"

[dependencies]
# Inkwell defaults to `target-all`, which references every LLVM backend's
# initializer. The pinned SDKs only build the host backend, so enable just that.
inkwell = { version = "0.11.0", default-features = false, features = ["llvm23-1", "llvm23-1-prefer-dynamic"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
inkwell = { version = "0.11.0", default-features = false, features = ["target-x86"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
inkwell = { version = "0.11.0", default-features = false, features = ["target-aarch64"] }
