# TEMPORARILY DISABLED: automatic triggers removed to save CI resources. Restore the previous push (tags: ['v*']) trigger (see git history) to re-enable.
name: Tested native release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/native-build.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cheeku-*
          path: distributions
          merge-multiple: true
      - name: Create a draft containing only tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" distributions/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/release-runtime.md
