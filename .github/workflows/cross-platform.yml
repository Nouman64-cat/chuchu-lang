# TEMPORARILY DISABLED: automatic triggers removed to save CI resources. Restore the previous push/pull_request triggers (see git history) to re-enable.
name: Cross-platform native compiler
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/native-build.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
